# LanDesk 交叉编译（OK3568 aarch64）与静态链接配置。
# 详见 docs/ops/ok3568-build.md。

# OK3568 / 通用 aarch64 目标
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# 静态链接（NFR-05 单文件二进制）
[build]
# 仅交叉编译时启用 rustflags，本地 x86_64 构建不受影响
rustflags = []

# ── 依赖来源：本地 vendor 目录 ──────────────────────────────
# 本环境 cargo 对 registry 源解包时会设置文件 mtime（futimens），
# 被系统 LSM 拦截（EPERM），导致 `cargo build` 反复 unpack 失败。
# 改用本地 directory source（不做 unpack、不设 mtime）彻底绕开。
# vendor/ 由 .workbuddy/scripts/vendor.py 生成（138 个 registry 包），已纳入仓库，
# 保证 CI / 任意 checkout 在离线（--offline）下可直接构建，无需访问 crates.io。
[source.crates-io]
replace-with = "vendored"

# 相对路径：cargo 以本 config.toml 所在目录（workspace 根）解析，跨机器可移植。
[source.vendored]
directory = "vendor"
