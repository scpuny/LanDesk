# LanDesk CI（M1）
#
# 设计要点：
# - 依赖锁定在仓库内 `vendor/`（directory source，见 .cargo/config.toml），
#   CI 无需访问 crates.io，构建确定性由 Cargo.lock + vendor 共同保证；
# - rust-toolchain.toml 固定 stable 通道；
# - aarch64 交叉编译配置（.cargo/config.toml [target.aarch64-unknown-linux-gnu]）
#   仅对该 target 门控，x86_64 本地/CI 构建不受影响。
# - 后续 M3+ 在此追加：clippy、fmt 检查、aarch64 OK3568 交叉编译 job、Tauri 前端构建。
# - M9 追加：三平台矩阵开启 clippy（对齐 architecture §6「cargo clippy + test」），
#   并新增 aarch64 编译检查 job（cross 容器，仅 check 不跑测试，OK3568 真机 M9 阶段跑 stable-72h.sh）。

name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main, dev]

# 同分支重复推送时取消旧 run，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & clippy & test (${{ matrix.os }})
    # 核心逻辑（lp/crypto/avcodec-wrap/capture）为纯平台无关实现，
    # 三平台全量回归；平台 API（input 注入、capture 实现）按 feature 门控。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Force LF checkout（保护 vendor 的 .cargo-checksum 完整性）
        # Windows runner 默认 git autocrlf=true，会把 vendor 嵌套 crate 的 text=auto 文件转 CRLF
        # → 工作区字节 ≠ .cargo-checksum.json 的 LF sha256 → cargo build --locked 报 checksum changed。
        # 与 release.yml 同一套修复，必须在 checkout 之前设全局（Linux/mac 无副作用）。
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: 还原 vendor/ 到 LF blob 字节（根治 Windows CRLF 转码）
        # 即便 autocrlf=false，嵌套 crate 的 `* text=auto` 仍可能按 core.eol=crlf(Windows 默认)
        # smudge 成 CRLF。显式 core.eol=lf + 先删工作区再 checkout -f，强制从 git 对象库
        # （blob 恒 LF）重新物化；stat 匹配会跳过重写，故必须 rm -rf。探针用 python3 校验。
        shell: bash
        run: |
          set -uo pipefail
          git config core.autocrlf false
          git config core.eol lf
          rm -rf vendor/ || { echo "vendor/ rm failed" >&2; exit 1; }
          git checkout -f HEAD -- vendor/ || { echo "vendor/ re-checkout failed" >&2; exit 1; }
          probe="vendor/strsim-0.11.1/tests/lib.rs"
          want="$(git cat-file blob "HEAD:${probe}" \
                   | python3 -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          got="$(python3 -c 'import sys,hashlib;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "${probe}")"
          [[ "${want}" == "${got}" ]] \
            || { echo "vendor/ self-heal FAILED ${probe}: want=${want} got=${got}" >&2; exit 1; }
          echo "vendor/ self-healed: ${probe} == HEAD LF blob (sha256 ${got})"

      - name: Install Rust (stable, toolchain pinned)
        # rust-toolchain.toml 声明 stable，rustup 按文件自动安装
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: landesk-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            landesk-${{ matrix.os }}-

      - name: Build workspace
        # vendor/ directory source 全本地，无需网络
        run: cargo build --locked

      - name: Clippy (M9 起开启)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  # aarch64 OK3568 交叉编译（仅 check，不跑测试；测试在真机 M9 阶段跑 stable-72h.sh）
  aarch64-compile-check:
    name: aarch64 compile-check (OK3568)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, toolchain pinned)
        uses: dtolnay/rust-toolchain@stable

      # 原方案 `curl cross-rs.dev/install.sh | sh` 在 runner 上 DNS 解析失败（curl: 6），
      # 且管道吞掉退出码 -> "安装成功"但 cross 未落盘 -> 后续 cross: command not found。
      # 改用 apt 系统交叉工具链（与 release.yml 的 linux-aarch64 job 一致），
      # 不依赖外部域名、不依赖 Docker；.cargo/config.toml 已设 linker=aarch64-linux-gnu-gcc。
      - name: Install aarch64 cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 cargo check
        # landesk-core 为流水线核心，跨机 OK3568 以它为准做编译检查。
        # CC_<target> 让 ring（cc C 构建）用目标 C 编译器，避免交叉 build.rs 探针失败。
        # libav 裁剪产物在真机/本地由 build-libav 提供，此 job 仅验证 Rust 侧可编译。
        run: |
          set -euo pipefail
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo check --locked --target aarch64-unknown-linux-gnu -p landesk-core
