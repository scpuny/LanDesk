            || echo "GUI build failed, skipping"
          B="ui/src-tauri/target/release/bundle/nsis"
          if [[ -d "$B" ]]; then
            mkdir -p dist/windows/gui
            find "$B" -maxdepth 1 -name '*.exe' 2>/dev/null | while read -r e; do
              cp -f "$e" "dist/windows/gui/landesk-${ver}-gui-windows-x86_64-setup.exe"
            done
