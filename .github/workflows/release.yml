          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Linux aarch64 (arm)：宿主 gcc-aarch64-linux-gnu 交叉（ring 需 CC_<target>）
  # 仅 CLI（GUI 跨 target 系统库暂不覆盖）。构建步 best-effort，失败不红整体 run。
