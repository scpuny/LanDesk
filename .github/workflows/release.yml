        # 跳过重写），再 `git checkout -f HEAD -- vendor/` 从 blob 强制物化为 LF。不用 `git archive|tar`
        # （Git-for-Windows 的 tar 不重写已存在 CRLF 文件，实测无效）。探针哈希用 python3。
