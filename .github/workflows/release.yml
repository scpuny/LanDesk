        # Tauri v2 on ubuntu-latest：webkit2gtk-4.1 等系统库 + dpkg-deb + rpmbuild；缺则跳过。
        continue-on-error: true
        run: |
          set -u
          ver="${GITHUB_REF_NAME#v}"
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config file libfuse2 rpm \
            || echo "apt install failed, GUI likely skipped"
