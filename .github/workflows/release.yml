          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Linux x86_64：CLI + GUI .deb（宿主直编，系统依赖 apt）
