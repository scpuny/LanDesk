# LanDesk Release（v0.2.0+：五架构矩阵 + 真 Tauri 安装包 + SHA256）
#
# 目标架构（用户指定 5 个）：
#   - macOS x86_64（intel）   ← macos job CLI 交叉 target
#   - macOS arm64（arch）     ← macos job 宿主 target（+ GUI .dmg/.app 原生）
#   - Linux amd64 (x86_64)   ← linux job 宿主构建（+ GUI .deb）
#   - Linux arm (aarch64)    ← linux-aarch64 job 宿主交叉（gcc-aarch64-linux-gnu + ring CC）
#   - Windows x86_64         ← windows job 宿主构建（+ GUI NSIS .exe 安装包）
#
# 产物分两层：
#   1) GUI 安装包（Tauri，headline 资产，best-effort 不阻塞）：
#      - macos arm64：`tauri build` → `LanDesk_*.dmg` + `LanDesk.app`（zip）
#      - windows    ：`tauri build` → `LanDesk_*_setup.exe`（NSIS 安装包）
#      - linux amd64：`tauri build` → `landesk_*.deb` + `*.rpm`
#      未签名/未公证：首运 macOS 右键-打开、Windows SmartScreen「仍要运行」。
#   2) 无头 CLI/服务端二进制（backbone，五架构全出）：controlled / controller /
#      relay-server / signaling-server → zip。主仓 vendor/ 已入库 → `--locked` 全离线确定性。
#
# 流程健壮性（修 v0.2.0 release #3 的 FAILED）：
#   - aarch64 交叉：设 CC_aarch64_unknown_linux_gnu 让 ring（cc C 构建）交叉成功；
#     该 job 构建步 `continue-on-error`，失败不红整体 run（有产物则出 aarch64 zip）。
#   - 所有 GUI/跨架构步 `continue-on-error`；upload `if: always()` + `if-no-files-found: warn`。
#   - release 聚合 job `if: ${{ !cancelled() }}`，`files: release-assets/*`（恒含 SHA256SUMS.txt，
#     空 zip 也不会 glob 崩溃）。单平台失败只缺资产，不整 run 红。
#
# 触发：
#   - 推 `v*` tag（如 v0.2.0）→ 自动打包并发 GitHub Release；
#   - 手动 `workflow_dispatch`：无 tag 时 ref_name=分支名，资产名用分支名兜底。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release + 上传资产

# 同 ref 重推 tag 串行（不取消在跑的）；release 聚合容忍缺失资产
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # macOS（arm64 runner）：CLI x86_64 + arm64；GUI arm64 原生 .dmg/.app（best-effort）
  # ------------------------------------------------------------------
  macos:
    name: build & package (macos)
    runs-on: macos-latest
    steps:
      - name: Force LF checkout（保护 vendor 的 .cargo-checksum 完整性）
        # GitHub Actions Windows runner 默认 git autocrlf=true，会把嵌套 crate 自带的
        # `* text=auto`（strsim/simd_cesu8/untrusted/typenum/unicode-ident 的 .gitattributes）
        # 在 clone 时把 vendor 文本文件转 CRLF → 工作区字节 ≠ .cargo-checksum.json 记录的
        # LF sha256 → `cargo build --locked` 报 "listed checksum has changed" exit 101。
        # 根仓 `.gitattributes` 的 `vendor/** -text` 被更近层的嵌套 .gitattributes 覆盖、
        # 无法根治，且那 5 个嵌套文件本身被 checksum 跟踪不能改 → 只能在 clone 前全局
        # 关 autocrlf（Linux/mac runner 本就以 false 运行，零副作用）。
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: 还原 vendor/ 到 LF blob 字节（根治 Windows CRLF 转码）
        # 无论 checkout 是否被 git autocrlf(Windows 默认 true) / 嵌套 .gitattributes(text=auto)
        # 转成 CRLF，都用 **仓库本地** `core.autocrlf false`（.git/config，覆盖 runner 全局预设）
        # + `git checkout -f HEAD -- vendor/` 从 git 对象库（blob 恒为 LF）重新物化整个 vendor 工作区：
        # autocrlf=false 时 text=auto 不做 CRLF smudge → 落盘原始 LF 字节，保证 == .cargo-checksum.json
        # 记录的 sha256。★ 关键两步：先 `rm -rf vendor/` 删工作区（否则 checkout -f 因 stat 缓存
        # 跳过重写），再 `git checkout -f HEAD -- vendor/` 从 blob 强制物化为 LF。不用 `git archive|tar`
        # （Git-for-Windows 的 tar 不重写已存在 CRLF 文件，实测无效）。探针哈希用 python3。
        shell: bash
        run: |
          set -uo pipefail
          git config core.autocrlf false
          # ★ core.eol=lf 必须显式设：Windows 上 core.eol 默认 crlf，
          #   嵌套 .gitattributes 的 `* text=auto`（strsim/simd_cesu8/untrusted）
          #   会让 checkout 把 LF blob smudge 成 CRLF，即使 autocrlf=false 也一样，
          #   → 工作区字节 ≠ .cargo-checksum.json 的 LF sha256 → checksum 失败 exit 101。
          git config core.eol lf
          # ★ 必须先删工作区文件再 checkout：git checkout -f 对「index stat 与工作区一致」
          #   的文件会跳过重写（Windows 上 checkout@v4 已落 CRLF 且 stat 匹配）→ 改 core.eol
          #   也没用。rm 掉后 git 无任何 stat 可复用，强制从 blob 重新物化为 LF。
          rm -rf vendor/ \
            || { echo "vendor/ rm failed" >&2; exit 1; }
          git checkout -f HEAD -- vendor/ \
            || { echo "vendor/ re-checkout failed" >&2; exit 1; }
          probe="vendor/strsim-0.11.1/tests/lib.rs"
          want="$(git cat-file blob "HEAD:${probe}" \
                   | python3 -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          got="$(python3 -c 'import sys,hashlib;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "${probe}")"
          [[ "${want}" == "${got}" ]] \
            || { echo "vendor/ self-heal FAILED ${probe}: want=${want} got=${got}" >&2; exit 1; }
          echo "vendor/ self-healed: ${probe} == HEAD LF blob (sha256 ${got})"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Apple targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build CLI (x86_64 + arm64, 主仓 vendor 离线)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            arch="${t%%-*}"
            echo "== CLI ${arch}"
            cargo build --release --locked \
              -p controlled -p controller -p relay-server -p signaling-server \
              --target "${t}"
            mkdir -p "dist/macos/cli-${arch}"
            for b in controlled controller relay-server signaling-server; do
              cp "target/${t}/release/${b}" "dist/macos/cli-${arch}/${b}"
            done
            ( cd "dist/macos" && zip -qr "landesk-${ver}-macos-${arch}.zip" "cli-${arch}" )
          done
          ls -1 "dist/macos"/*.zip

      - name: GUI installer (.dmg/.app, x86_64 + arm64, best-effort)
        # 壳 vendor/ 未入库：摘掉壳离线配置 → 在线拉 crates.io（shell Cargo.lock 已入库保确定性）。
        # tauri build 用 @tauri-apps/cli 预编译二进制（快，免 cargo install）。
        # 双 arch 各出 .dmg + .app；失败不影响 CLI 资产；配置用绝对路径 trap 无条件还原。
        continue-on-error: true
        run: |
          set -u
          ver="${GITHUB_REF_NAME#v}"
          WS="${GITHUB_WORKSPACE}"
          CFG="${WS}/ui/src-tauri/.cargo/config.toml"
          BAK="${CFG}.bak"
          mv "${CFG}" "${BAK}" 2>/dev/null || true
          trap 'mv "${BAK}" "${CFG}" 2>/dev/null || true' EXIT
          ( cd ui/frontend && npm ci && npm run build )
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            arch="${t%%-*}"
            echo "== GUI dmg/app ${arch}"
            ( cd ui/src-tauri && node ../frontend/node_modules/@tauri-apps/cli/tauri.js build \
                --features tauri --target "${t}" ) \
              || { echo "GUI build ${arch} failed, skipping"; continue; }
            B="ui/src-tauri/target/${t}/release/bundle"
            mkdir -p "${WS}/dist/macos/gui"
            find "$B/dmg" -name '*.dmg' 2>/dev/null | while read -r d; do
              cp -f "$d" "${WS}/dist/macos/gui/landesk-${ver}-gui-macos-${arch}.dmg"
            done
            APP=$(find "$B/app" -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
            if [[ -n "${APP:-}" ]]; then
              APPDIR="$(cd "$(dirname "$APP")" && pwd)"
              ( cd "${APPDIR}" && zip -qr "landesk-${ver}-gui-macos-${arch}-app.zip" "$(basename "${APP}")" )
              mv -f "${APPDIR}/landesk-${ver}-gui-macos-${arch}-app.zip" "${WS}/dist/macos/gui/"
            fi
          done
          echo "GUI dmg/app: $(ls -1 "${WS}/dist/macos/gui" 2>/dev/null | tr '\n' ' ')"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Windows x86_64：CLI + GUI NSIS 安装包（.exe，未签名）
  # ------------------------------------------------------------------
  windows:
    name: build & package (windows-x86_64)
    runs-on: windows-latest
    steps:
