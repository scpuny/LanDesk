            || { echo "vendor/ self-heal FAILED ${probe}: want=${want} got=${got}" >&2; exit 1; }
          echo "vendor/ self-healed: ${probe} == HEAD LF blob (sha256 ${got})"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CLI (x86_64, 主仓 vendor 离线)
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          cargo build --release --locked \
            -p controlled -p controller -p relay-server -p signaling-server
          mkdir -p dist/windows/cli
          for b in controlled controller relay-server signaling-server; do
            cp "target/release/${b}.exe" "dist/windows/cli/${b}.exe"
          done
          ( cd dist/windows && tar -a -c -f "landesk-${ver}-windows-x86_64.zip" cli )
          ls -1 dist/windows/*.zip

      - name: GUI installer (NSIS .exe, best-effort)
        # WebView2 运行时由用户机自带/在线下载；产物未签名。
        continue-on-error: true
        shell: bash
        run: |
          set -u
          ver="${GITHUB_REF_NAME#v}"
