      - uses: actions/checkout@v4

      - name: 还原 vendor/ 到 LF blob 字节（根治 Windows CRLF 转码）
        # 无论 checkout 是否被 git autocrlf(Windows 默认 true) / 嵌套 .gitattributes(text=auto)
        # 转成 CRLF，都用 **仓库本地** `core.autocrlf false`（.git/config，覆盖 runner 全局预设）
        # + `git checkout -f HEAD -- vendor/` 从 git 对象库（blob 恒为 LF）重新物化整个 vendor 工作区：
        # autocrlf=false 时 text=auto 不做 CRLF smudge → 落盘原始 LF 字节，保证 == .cargo-checksum.json
        # 记录的 sha256。★ 关键两步：先 `rm -rf vendor/` 删工作区（否则 checkout -f 因 stat 缓存
        # 跳过重写），再 `git checkout -f HEAD -- vendor/` 从 blob 强制物化为 LF。不用 `git archive|tar`
        # （Git-for-Windows 的 tar 不重写已存在 CRLF 文件，实测无效）。探针哈希用 python3。
        shell: bash
        run: |
          set -uo pipefail
          git config core.autocrlf false
          # ★ core.eol=lf 必须显式设：Windows 上 core.eol 默认 crlf，
          #   嵌套 .gitattributes 的 `* text=auto`（strsim/simd_cesu8/untrusted）
          #   会让 checkout 把 LF blob smudge 成 CRLF，即使 autocrlf=false 也一样，
          #   → 工作区字节 ≠ .cargo-checksum.json 的 LF sha256 → checksum 失败 exit 101。
          git config core.eol lf
          # ★ 必须先删工作区文件再 checkout：git checkout -f 对「index stat 与工作区一致」
          #   的文件会跳过重写（Windows 上 checkout@v4 已落 CRLF 且 stat 匹配）→ 改 core.eol
          #   也没用。rm 掉后 git 无任何 stat 可复用，强制从 blob 重新物化为 LF。
          rm -rf vendor/ \
            || { echo "vendor/ rm failed" >&2; exit 1; }
          git checkout -f HEAD -- vendor/ \
            || { echo "vendor/ re-checkout failed" >&2; exit 1; }
          probe="vendor/strsim-0.11.1/tests/lib.rs"
          want="$(git cat-file blob "HEAD:${probe}" \
                   | python3 -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          got="$(python3 -c 'import sys,hashlib;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "${probe}")"
          [[ "${want}" == "${got}" ]] \
            || { echo "vendor/ self-heal FAILED ${probe}: want=${want} got=${got}" >&2; exit 1; }
          echo "vendor/ self-healed: ${probe} == HEAD LF blob (sha256 ${got})"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install aarch64 cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu

      - name: Build CLI (aarch64, ring CC 交叉, best-effort)
        # 主仓 .cargo/config.toml 已设 linker=aarch64-linux-gnu-gcc；再补 CC_<target>
        # 让 ring（cc C 构建）能用目标 C 编译器，避免交叉 build.rs 探针失败。
        continue-on-error: true
        run: |
          set -u
          ver="${GITHUB_REF_NAME#v}"
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          echo "== cross CLI aarch64"
          cargo build --release --locked \
            -p controlled -p controller -p relay-server -p signaling-server \
            --target aarch64-unknown-linux-gnu \
            && {
              mkdir -p dist/linux-aarch64/cli
              for b in controlled controller relay-server signaling-server; do
                cp "target/aarch64-unknown-linux-gnu/release/${b}" "dist/linux-aarch64/cli/${b}"
              done
              file dist/linux-aarch64/cli/controlled || true
              ( cd dist/linux-aarch64 && zip -qr "landesk-${ver}-linux-aarch64.zip" cli )
              echo "aarch64 CLI ready"
            } \
            || echo "aarch64 cross build failed (ring/CC?), skipping aarch64 assets"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-aarch64
          path: dist/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # 聚合：SHA256 + 版本说明 + 发 GitHub Release（恒含 SHA256SUMS.txt，glob 不空）
  # ------------------------------------------------------------------
  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [macos, windows, linux, linux-aarch64]
    # 单平台 job 失败/缺资产不阻塞发布（notes 标注）；仅全取消才不发
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 聚合资产（安装包 + CLI zip）+ SHA256
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          # 收集所有产物：CLI zip + 各平台安装包（dmg / deb / exe / app zip）
          # download-artifact 展平到 dist/<artifact-name>/...；递归取全部目标扩展
          # ★ 多个 -name 之间必须显式 -o：默认 AND 会让一个文件无法同时匹配所有扩展 → 永远空
          find dist -type f \( -name 'landesk-*.zip' \
                                 -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
                                 -o -name '*-setup.exe' -o -name '*-app.zip' \) \
               -exec cp -f {} release-assets/ \; 2>/dev/null || true
          # 归一化命名兜底：若某 GUI 步没来得及归一（原始 tauri 名），补成 landesk-* 前缀。
          # （各 GUI 步已 cp 成 landesk-* 名，此处多数是 no-op；*.dmg 不区分 arch 兜底命名）
          ( cd release-assets && for f in *; do
              [[ "${f}" == landesk-* || -f SHA256SUMS.txt ]] && continue
              case "$f" in
                *.dmg)  mv -f "$f" "landesk-${ver}-gui-macos.dmg" ;;
                *.deb)  mv -f "$f" "landesk-${ver}-gui-linux-x86_64.deb" ;;
                *.rpm)  mv -f "$f" "landesk-${ver}-gui-linux-x86_64.rpm" ;;
                *.exe)  mv -f "$f" "landesk-${ver}-gui-windows-x86_64-setup.exe" ;;
              esac
            done )
          # SHA256：非空才算（避免 `sha256sum` 无参时读 stdin 挂死）；find -exec + 空格安全
          has_assets=$(cd release-assets && ls -1 2>/dev/null | grep -v '^SHA256SUMS.txt$' | head -1 || true)
          if [[ -n "${has_assets:-}" ]]; then
            ( cd release-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' \
                -exec sha256sum {} + > SHA256SUMS.txt )
          else
            echo "sha256sum: no assets (all build jobs failed?)" > release-assets/SHA256SUMS.txt
          fi

          # 实际产出的资产清单（写进 notes，缺哪个一目了然）
          {
            echo "LanDesk v${ver}（tag ${GITHUB_REF_NAME}）"
            echo ""
            echo "## 本次产出资产"
            echo '```'
            ls -1 release-assets/ | grep -v '^SHA256SUMS.txt$' || echo "（无——各构建 job 需查日志）"
            echo '```'
            echo ""
            echo "## GUI 安装包（headline）"
            echo "- macOS：\`landesk-${ver}-gui-macos-{x86_64,arm64}.dmg\`（+ 对应 .app zip）—未公证，首运右键-打开"
            echo "- Windows x64：\`landesk-${ver}-gui-windows-x86_64-setup.exe\`（NSIS，未签名）"
            echo "- Linux amd64：\`landesk-${ver}-gui-linux-x86_64.deb\` + \`landesk-${ver}-gui-linux-x86_64.rpm\`（依赖 libwebkit2gtk-4.1 / gtk3）"
            echo "- 缺某平台：该 GUI 步 best-effort 失败，见对应 job 日志；CLI zip 仍可用。"
            echo ""
            echo "## 无头 CLI / 服务端（五架构 backbone）"
            echo "- \`landesk-${ver}-macos-{x86_64,arm64}.zip\` / \`landesk-${ver}-windows-x86_64.zip\`"
            echo "  / \`landesk-${ver}-linux-x86_64.zip\` / \`landesk-${ver}-linux-aarch64.zip\`（交叉 best-effort）"
            echo "- 每 zip 含 controlled / controller / relay-server / signaling-server"
            echo "- 为**无编码 feature 骨架**：完整 H.264/硬编产物需本地备 thirdparty/ 后跑"
            echo "  \`scripts/release/build-all.sh\`。"
            echo ""
            echo "## 校验"
            echo "- \`SHA256SUMS.txt\`"
            echo "- 稳定性验证：\`scripts/release/stable-72h.sh\`。"
          } > release-notes.md
          echo "---- 资产清单 ----"
          ls -1 release-assets/

      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LanDesk ${{ github.ref_name }}"
          files: |
            release-assets/*
          body_path: release-notes.md
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
