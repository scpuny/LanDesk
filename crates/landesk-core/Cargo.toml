[package]
name = "landesk-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LanDesk 会话编排层（无 GUI，tokio）：会话状态机 + 采集→编码→QUIC 流水线。M1 占位。"

[dependencies]
lp = { workspace = true }
crypto = { workspace = true }
avcodec-wrap = { workspace = true }
capture = { workspace = true }
input = { workspace = true }
quic-link = { workspace = true }
ice = { workspace = true }
signaling = { workspace = true }
mdns = { workspace = true }
clipboard = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# openh264：真 H.264 编码（avcodec-wrap/openh264）+ 平台真实采屏。
# GUI / ui-server 生产构建经 landesk-ui 默认开启；纯逻辑测试可关闭以跳过 C++ 编译。
openh264 = ["avcodec-wrap/openh264"]

[dev-dependencies]
mdns = { workspace = true }
lp = { workspace = true }
quic-link = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
