<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 主渐变：品牌蓝，多 stop 制造纵向纵深 -->
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7DB4FF"/>
      <stop offset="0.28" stop-color="#5B98F8"/>
      <stop offset="0.62" stop-color="#3B7AEC"/>
      <stop offset="1" stop-color="#2356C6"/>
    </linearGradient>
    <!-- 左上柔光：模拟顶部光源 -->
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下暗角：增加立体纵深 -->
    <radialGradient id="vignette" cx="0.46" cy="0.4" r="0.76">
      <stop offset="0.55" stop-color="#0B2E6E" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2E6E" stop-opacity="0.30"/>
    </radialGradient>
    <!-- 屏幕内凹：比背景更深的蓝 -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4FA8"/>
      <stop offset="1" stop-color="#2C63C4"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A2A66" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 四周留白：内容缩放至画布中央，透明边距约 8.6%，避免 macOS 程序坞中被撑满 -->
  <g transform="translate(88 88) scale(0.828125)">
    <!-- 圆角方形底：主渐变 + 柔光 + 暗角三层叠加 -->
    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#glow)"/>
    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#vignette)"/>
    <!-- 顶部内边缘微光 -->
    <rect x="12" y="12" width="1000" height="1000" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"/>

    <!-- 显示器：实心白框 + 内凹深蓝屏，带柔和投影 -->
    <g filter="url(#softShadow)">
      <rect x="178" y="248" width="668" height="452" rx="60" fill="#FFFFFF"/>
      <rect x="222" y="292" width="580" height="364" rx="34" fill="url(#screen)"/>
      <path d="M512 700 v74" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
      <path d="M386 806 h252" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
    </g>

    <!-- 屏幕中央：摄像机（机身 + 镜头 + 侧凸起），经典造型识别度更高 -->
    <g filter="url(#softShadow)">
      <!-- 机身 -->
      <rect x="378" y="396" width="216" height="152" rx="40" fill="#FFFFFF"/>
      <!-- 镜头：深蓝外环 + 深蓝瞳孔 -->
      <circle cx="486" cy="472" r="44" fill="none" stroke="#2C63C4" stroke-width="14"/>
      <circle cx="486" cy="472" r="14" fill="#2C63C4"/>
      <!-- 侧凸起（镜头筒） -->
      <rect x="586" y="428" width="56" height="92" rx="28" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
