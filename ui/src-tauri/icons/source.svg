<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 品牌蓝渐变：与 UI 品牌色 #478AF6 同色系 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C9BFF"/>
      <stop offset="0.55" stop-color="#478AF6"/>
      <stop offset="1" stop-color="#2F6BE0"/>
    </linearGradient>
    <!-- 屏幕内高光 -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#123A80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 四周留白：内容缩放至画布中央，透明边距约 8.6%，避免 macOS 程序坞中被撑满 -->
  <g transform="translate(88 88) scale(0.828125)">
    <!-- 圆角方形底 -->
    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

    <!-- 显示器主体（描边风格，沿用 UI monitor 图标语言） -->
    <g filter="url(#shadow)">
      <rect x="178" y="248" width="668" height="452" rx="56"
            fill="url(#screen)" stroke="#FFFFFF" stroke-width="46"/>
      <path d="M512 700 v78" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
      <path d="M388 822 h248" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    </g>

    <!-- 屏幕中央：摄像头（远程视频含义），B 档尺寸，与显示器同一白色描边语言 -->
    <g>
      <rect x="368" y="384" width="288" height="180" rx="46"
            fill="url(#screen)" stroke="#FFFFFF" stroke-width="42"/>
      <circle cx="512" cy="474" r="59" fill="none" stroke="#FFFFFF" stroke-width="34"/>
      <circle cx="512" cy="474" r="19" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
