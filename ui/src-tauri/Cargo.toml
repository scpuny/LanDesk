[package]
name = "landesk-app"
version = "0.5.0"
edition = "2021"
authors = ["LanDesk Team"]
license = "MIT"
description = "LanDesk Tauri 壳（形态 B，M8）：调 landesk-ui 纯命令内核。tauri feature 默认关——离线 vendor 无 tauri，需 Tauri 工具链时开启。"

# ★ 自成 workspace（空表 = 本目录为 root，与 LanDesk 主仓断离）：
# 主仓 `cargo build/test --offline --locked` 不解析本壳的 lock，98 测试离线门不受污染。
# 首次编译需联网生成本壳独立 lock + 安装 Tauri CLI（见 README）。
[workspace]

[lib]
name = "landesk_app"
path = "src/lib.rs"

[[bin]]
name = "landesk-app"
path = "src/main.rs"

[features]
default = []
# 开启后编译 Tauri app 本体（需 tauri crate + GUI/系统依赖，离线 vendor 不含）。
tauri = ["dep:tauri", "dep:tauri-build", "dep:tracing", "dep:base64"]

[dependencies]
# 纯命令内核 + 全部业务类型（经 landesk-ui re-export；已在主仓离线 vendor）。
landesk-ui = { path = "../../crates/ui" }
tokio = { version = "1", features = ["full"] }
# 会话窗 `SessionLaunchPayload` 用 `#[derive(Serialize/Deserialize)]`（壳自身结构，非
# landesk-ui re-export；`landesk_ui::SessionTargetView` 已 `Serialize`）。serde 1.0.229
# 在壳 vendor（tauri 传递依赖），离线 --locked 不动。
serde = { version = "1.0", features = ["derive"] }

# Tauri 本体（feature-gate，默认不编译）。
tauri = { version = "2", optional = true }
# P2.7 最小日志捕获：直接依赖 `tracing`（壳 vendor 已含 0.1.44 + tracing-core，离线安全）。
# 仅 tauri feature 用（手搓 Subscriber 捕获进 LogRing，不引 tracing-subscriber）。
tracing = { version = "0.1", optional = true }
# 会话窗「截图」命令解码 data-URL PNG 落盘（0.22.1 与主仓 vendor / pem 统一）。
# 用 0.22 避免离线 vendor 只有 0.22.1（0.21.7 仅供 swift-rs，壳改 0.22 无需新增 vendor crate）。
base64 = { version = "0.22", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
